<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nota Fiscal - Geo Center</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="card">
    <a class="voltar" href="/menu">← Voltar</a>
    <h1>Geo Center</h1>
    <h3>Enviar Nota Fiscal</h3>

    <form method="POST" action="/nf" enctype="multipart/form-data">
        <input name="cliente" placeholder="Nome do Cliente" required>
        <input name="telefone" placeholder="WhatsApp" required>
        <input type="file" name="pdf" accept=".pdf" required>
        <button type="submit">Enviar Nota Fiscal</button>
    </form>
</div>
</body>
</html>
