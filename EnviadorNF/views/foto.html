<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Foto - Geo Center</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="card">
    <a class="voltar" href="/menu">← Voltar</a>
    <h1>Geo Center</h1>
    <h3>Enviar Foto</h3>

    <form method="POST" action="/foto" enctype="multipart/form-data">
        <input name="cliente" placeholder="Nome do Cliente" required>
        <input name="telefone" placeholder="WhatsApp" required>
        <input type="file" name="foto" accept="image/*" required>

        <textarea name="legenda" rows="6" required>Olá! Tudo bem?

Conforme combinamos, segue a foto da joia.

Caso tenha qualquer dúvida, estou à disposição.</textarea>

        <button type="submit">Enviar Foto</button>
    </form>
</div>
</body>
</html>
